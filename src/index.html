<!DOCTYPE html>
<html lang="tg" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Полный Landing Page — Tailwind CSS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = { theme: { extend: { colors: { brandBlue: '#0f3d61', brandDarkBlue: '#0b2840', brandCyan: '#00b4d8', brandTeal: '#00a896', brandLightBg: '#f8fafc'}}}}
  </script>
</head>
<body class="font-sans text-gray-700 bg-white antialiased">
    
    <div style="background-image: url(/uae-4-2048x1367\ 2.png);" >
<header class="relative w-full min-h-screen bg-cover bg-center bg-no-repeat flex flex-col justify-between" 
        style="background-image: linear-gradient(to bottom, rgba(10, 25, 47, 0.75), rgba(10, 25, 47, 0.85)), url('YOUR_BACKGROUND_IMAGE.jpg');">
  <nav class="w-full max-w-[1200px] mx-auto px-4 py-6 flex items-center justify-between z-10">
    <div class="text-white font-extrabold text-2xl tracking-wider ml-[-300px] flex items-center">
      INNOMA<span class="text-[#03A8DC]">.VC</span>
    </div>

    <div class="hidden md:flex items-center space-x-8 text-white/90 text-sm font-medium">
      <p class="hover:text-[#03A8DC] transition-colors">Кто мы?</p>
      <p class="hover:text-[#03A8DC] transition-colors">Услуги</p>
      <p class="hover:text-[#03A8DC] transition-colors">Акселератор</p>
      <p class="hover:text-[#03A8DC] transition-colors">Новости</p>
    </div>

    <div>
      <button class="bg-[#00c896] hover:bg-[#00b084] text-white font-semibold text-sm px-6 py-2.5 rounded-lg transition-colors shadow-md inline-block">
        Войти
      </button>
    </div>
  </nav>

  <div class="w-full max-w-[1200px] mx-auto px-4 py-20 my-auto z-10 flex flex-col items-start">
    <div class="max-w-3xl space-y-4">
      
      <h1 class="text-white text-3xl sm:text-5xl md:text-6xl font-black uppercase tracking-wide leading-none">
        ЗАПУСТИТЕ
      </h1>

      <div class="inline-block bg-[#00c896] text-white px-4 py-2 text-2xl sm:text-4xl md:text-5xl font-extrabold uppercase tracking-wide rounded-sm shadow-lg">
        ТЕХНОЛОГИЧЕСКИЙ IT-БИЗНЕС
      </div>

      <h2 class="text-white text-2xl sm:text-4xl md:text-5xl font-black uppercase tracking-wide leading-tight">
        НА МЕЖДУНАРОДНЫХ РЫНКАХ
      </h2>

      <p class="text-gray-200 text-lg sm:text-xl font-normal pt-2">
        Открыт набор заявок на акселератор
      </p>

      <div class="pt-6">
        <button class="bg-[#3898ec] hover:bg-[#2888dc] text-white font-bold text-base px-8 py-3.5 rounded-md transition-all duration-200 shadow-lg inline-block">
          Подать заявку
        </button>
      </div>

    </div>
  </div>

  <div class="h-10"></div>
</header>

</body>
</html>
